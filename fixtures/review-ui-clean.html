<!doctype html>
<html lang="en">
<head><title>Clean controls</title>
<style>
:root { --readable: #000000; --surface: #ffffff; }
.readable { color: var(--readable); background-color: var(--surface); }
</style></head>
<body><main>
  <button>Save</button>
  <label for="email">Email</label>
  <input type="email" id="email">
  <button onclick="openPreferences()">Open preferences</button>
  <p class="readable">Read this</p>
</main></body></html>
