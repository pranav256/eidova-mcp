name: Service checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build:upstream
      - run: git diff --exit-code vendor/upstream/runtime.mjs
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run smoke:stdio
      - run: npm run smoke:package
      - run: npm run benchmark -- --check
      - run: npm run audit:themes
      - run: npm audit --omit=dev
      - name: Build and smoke the Docker image
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        shell: bash
        run: |
          docker build -t eidova-smoke .
          docker volume create eidova-smoke-state
          trap 'docker logs eidova-smoke; docker rm -f eidova-smoke; docker volume rm eidova-smoke-state' EXIT
          docker run -d --name eidova-smoke -p 3000:3000 \
            -v eidova-smoke-state:/app/.eidova \
            -e EIDOVA_BASE_URL=http://localhost:3000 eidova-smoke
          curl --fail --silent --retry 30 --retry-all-errors --retry-delay 1 http://localhost:3000/health
          npm run smoke -- http://localhost:3000/mcp
          npm run smoke -- http://localhost:3000/mcp/full
          npm run smoke:private -- http://localhost:3000
  consumers:
    # Playwright 1.56.1 requires a supported Ubuntu release.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Install and review clean Vite and Next consumers
        shell: bash
        run: |
          node dist/main.js > /tmp/eidova-consumer-service.log 2>&1 &
          mcp_service_pid=$!
          trap 'kill "$mcp_service_pid"' EXIT
          for attempt in {1..40}; do
            if curl --fail --silent http://localhost:3000/health > /dev/null; then break; fi
            sleep 0.25
          done
          npm run verify:consumers
